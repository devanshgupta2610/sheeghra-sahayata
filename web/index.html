<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheeghra Sahayata — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <main class="wrap">
    <div class="card stack">
      <div class="row spread">
        <h1 class="brand" id="brand">Sheeghra Sahayata</h1>
        <button type="button" class="btn btn-soft" id="lang-btn">हि</button>
      </div>
      <p class="tagline" id="tagline">Smart Tourist Safety</p>

      <div class="tabs">
        <button type="button" class="tab active" data-mode="login" id="tab-login">Log in</button>
        <button type="button" class="tab" data-mode="signup" id="tab-signup">Sign up</button>
      </div>

      <form id="auth-form" class="stack">
        <div>
          <label for="phone" id="lbl-phone">Phone number</label>
          <input class="field" id="phone" name="phone" placeholder="Enter your phone number" required />
        </div>
        <div>
          <label for="otp" id="lbl-otp">OTP</label>
          <input class="field" id="otp" name="otp" placeholder="Enter OTP" maxlength="6" required />
        </div>

        <div id="signup-fields" class="stack hidden">
          <div>
            <label for="name" id="lbl-name">Full name</label>
            <input class="field" id="name" />
          </div>
          <div>
            <label for="emergency" id="lbl-emergency">Emergency contact</label>
            <input class="field" id="emergency" />
          </div>
          <div class="row">
            <div style="flex:1">
              <label for="blood" id="lbl-blood">Blood group</label>
              <input class="field" id="blood" placeholder="B+" />
            </div>
            <div style="flex:1">
              <label for="allergies" id="lbl-allergies">Allergies</label>
              <input class="field" id="allergies" />
            </div>
          </div>
          <div>
            <label for="age" id="lbl-age">Age range</label>
            <select class="field" id="age">
              <option value="18-35">18–35</option>
              <option value="36-59">36–59</option>
              <option value="60+" selected>60+</option>
              <option value="under-18">Under 18</option>
            </select>
          </div>
          <div class="row">
            <div style="flex:1">
              <label for="gender" id="lbl-gender">Gender</label>
              <select class="field" id="gender">
                <option value="">Prefer not to say</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
        </div>

        <div id="error" class="error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>
      </form>

      <p class="muted" style="text-align:center;margin:0">
        <a href="/dashboard" id="dash-link">Authority Dashboard</a>
      </p>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/ai.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
